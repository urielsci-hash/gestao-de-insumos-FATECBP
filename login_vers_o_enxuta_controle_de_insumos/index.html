<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
<script type="module">
    import { supabase } from './js/supabase.js';

    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'painel.html';
    });

    window.togglePasswordVisibility = function() {
      const p = document.getElementById('corporatePassword');
      const e = document.getElementById('eyeIcon');
      if (p.type === 'password') { p.type = 'text'; e.textContent = 'visibility_off'; } 
      else { p.type = 'password'; e.textContent = 'visibility'; }
    }

    window.fillProfile = function(role) {
      document.getElementById('corporateEmail').value = role === 'admin' ? 'admin.ti@insumos.org' : 'colaborador@insumos.org';
      document.getElementById('corporatePassword').value = role === 'admin' ? 'Gestor#TI2024!' : 'Requisicao#2024';
    }

    window.handleLoginSubmit = async function() {
      const email = document.getElementById('corporateEmail').value;
      const password = document.getElementById('corporatePassword').value;
      const btn = document.getElementById('btnSubmit');
      
      if (!email || !password) return;
      btn.innerHTML = 'Entrando...';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      
      if (error) {
        btn.innerHTML = 'Erro no Login';
        alert('E-mail ou senha inválidos.');
      } else {
        btn.innerHTML = 'Acesso Autorizado!';
        window.location.href = 'painel.html';
      }
    }
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col justify-between antialiased selection:bg-primary selection:text-white">
<!-- Main Container -->
<main class="w-full flex-1 flex flex-col items-center justify-center px-4 py-10 sm:py-16">
<div class="w-full max-w-[400px] flex flex-col items-center">
<!-- Top Branding -->
<div class="flex flex-col items-center text-center mb-7">
<div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-surface-container-lowest shadow-sm p-3 mb-4 flex items-center justify-center transition-all hover:scale-105 border border-border-subtle">
<img alt="Controle de Insumos" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkxF1JEIpve6XIv-dI-vSFP7SuD8Bh7bxoNo9FtPQ8MYXClMMTodvM_KBIT8uBmiTnQvzs5x8uaGmZ2aWwG7dKKQYukUGeY1hxxK7mEox20zYlMUSGgixm_QMy1Vxfw3semiklUJCgH2nk8KmBhZaT1Xr8JpLrS-0wzSMrz5JtlEkMYZ9CQpkmEhumacKEeMwUOefpiK4nz1_BL6sTD-LmHzR1PxdUH2iBifwJT6JrCNbAC2ytGI4rRqwyaDh5z-EFkq0"/>
</div>
<h1 class="font-display-lg text-2xl sm:text-[26px] font-bold text-on-surface tracking-tight">
          Controle de Insumos
        </h1>
<p class="font-body-sm text-sm text-outline mt-1 font-normal">
          Acesse para gerenciar solicitações e estoque
        </p>
</div>
<!-- Minimalist Card -->
<div class="w-full bg-surface-container-lowest rounded-2xl shadow-sm border border-border-subtle p-7 sm:p-8">
<form class="space-y-4" id="authForm" onsubmit="event.preventDefault(); handleLoginSubmit();">
<!-- E-mail -->
<div class="space-y-1.5">
<label class="block font-label-md text-xs font-semibold text-on-surface" for="corporateEmail">
              E-mail Corporativo
            </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[18px] pointer-events-none">
                alternate_email
              </span>
<input class="w-full pl-10 pr-3.5 py-2.5 rounded-lg border border-border-subtle bg-surface-bright/50 text-on-surface text-sm placeholder:text-outline/50 focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="corporateEmail" name="email" placeholder="seu.email@empresa.com" required="" type="email"/>
</div>
</div>
<!-- Senha -->
<div class="space-y-1.5">
<div class="flex items-center justify-between">
<label class="block font-label-md text-xs font-semibold text-on-surface" for="corporatePassword">
                Senha
              </label>
<button class="font-label-sm text-xs text-primary hover:text-secondary focus:outline-none transition-colors" onclick="showPasswordHelpAlert()" type="button">
                Esqueceu?
              </button>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-[18px] pointer-events-none">
                lock
              </span>
<input class="w-full pl-10 pr-10 py-2.5 rounded-lg border border-border-subtle bg-surface-bright/50 text-on-surface text-sm placeholder:text-outline/50 focus:bg-white focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" id="corporatePassword" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Alternar exibição de senha" class="absolute right-3 text-outline hover:text-on-surface focus:outline-none p-1 flex items-center justify-center transition-colors" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[18px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Lembrar de mim -->
<div class="flex items-center pt-0.5">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded border-border-subtle text-primary focus:ring-primary/20 accent-primary cursor-pointer" id="rememberDevice" type="checkbox"/>
<span class="font-body-sm text-xs text-on-surface-variant">Lembrar de mim</span>
</label>
</div>
<!-- Botão Primário -->
<button class="w-full mt-2 py-2.5 px-4 rounded-lg bg-primary hover:bg-[#1a3eb8] active:scale-[0.99] text-white font-headline-sm text-sm font-semibold flex items-center justify-center gap-2 shadow-sm transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-primary/30" id="btnSubmit" type="submit">
<span class="material-symbols-outlined text-[18px]" id="btnIcon">login</span>
<span id="btnText">Entrar</span>
</button>
</form>
<!-- Atalhos Minimalistas de Teste -->
<div class="mt-6 pt-5 border-t border-border-subtle flex flex-wrap items-center justify-center gap-1.5 text-xs text-on-surface-variant">
<span class="text-outline">Atalhos de teste:</span>
<button class="px-2 py-0.5 rounded-md hover:bg-surface-container font-medium text-primary transition-colors" onclick="fillProfile('admin')" type="button">
            Admin
          </button>
<span class="text-outline/40">|</span>
<button class="px-2 py-0.5 rounded-md hover:bg-surface-container font-medium text-primary transition-colors" onclick="fillProfile('colaborador')" type="button">
            Solicitante
          </button>
</div>
</div>
<!-- Rodapé Mínimo -->
<div class="mt-8 text-center text-xs text-outline space-y-1 font-body-sm">
<p>© 2026 Controle de Insumos · Suprimentos &amp; Almoxarifado</p>
</div>
</div>
</main>
<!-- Notification Toast -->
<div class="fixed bottom-5 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-inverse-surface text-inverse-on-surface px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 transition-all duration-300 opacity-0 pointer-events-none translate-y-4 z-50 text-xs sm:text-sm" id="feedbackToast">
<span class="material-symbols-outlined text-[#a7d47e] text-[20px]" id="toastIcon">check_circle</span>
<div class="flex-1 min-w-0">
<p class="font-body-sm truncate" id="toastMessage">Ação realizada com sucesso</p>
</div>
</div>
<script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('corporatePassword');
      const eyeIcon = document.getElementById('eyeIcon');
      if (!passwordInput || !eyeIcon) return;

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        eyeIcon.textContent = 'visibility';
      }
    }

    function fillProfile(role) {
      const emailField = document.getElementById('corporateEmail');
      const passwordField = document.getElementById('corporatePassword');
      
      if (role === 'admin') {
        emailField.value = 'admin.ti@insumos.org';
        passwordField.value = 'Gestor#TI2024!';
        triggerToast('Atalho carregado: Administrador', 'admin_panel_settings');
      } else {
        emailField.value = 'colaborador@insumos.org';
        passwordField.value = 'Requisicao#2024';
        triggerToast('Atalho carregado: Solicitante', 'person');
      }
      emailField.focus();
    }

    function handleLoginSubmit() {
      const email = document.getElementById('corporateEmail').value;
      const btn = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnText');
      const btnIcon = document.getElementById('btnIcon');

      if (!email) return;

      btn.classList.add('opacity-75', 'pointer-events-none');
      btnIcon.textContent = 'progress_activity';
      btnIcon.classList.add('animate-spin');
      btnText.textContent = 'Entrando...';

      setTimeout(() => {
        btn.classList.remove('opacity-75', 'pointer-events-none');
        btnIcon.classList.remove('animate-spin');
        btnIcon.textContent = 'check_circle';
        btnText.textContent = 'Acesso Autorizado!';
        
        triggerToast('Sessão validada. Redirecionando...', 'verified_user');

        setTimeout(() => {
          btnIcon.textContent = 'login';
          btnText.textContent = 'Entrar';
        }, 2000);
      }, 1000);
    }

    function showPasswordHelpAlert() {
      triggerToast('Contate o suporte interno para redefinir sua senha.', 'help');
    }

    function triggerToast(message, iconName = 'info') {
      const toast = document.getElementById('feedbackToast');
      const msg = document.getElementById('toastMessage');
      const icon = document.getElementById('toastIcon');

      if (!toast || !msg || !icon) return;

      msg.textContent = message;
      icon.textContent = iconName;

      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
      toast.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(window.__toastTimeout);
      window.__toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
      }, 3000);
    }
  </script>
</body></html>
