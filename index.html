<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Login - Controle de Insumos</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6faff] min-h-screen flex flex-col justify-center items-center py-10 px-4 font-['Inter']">
<div class="w-full max-w-[400px]">
  <div class="flex flex-col items-center text-center mb-7">
    <div class="w-20 h-20 rounded-2xl bg-white shadow-sm p-3 mb-4 flex items-center justify-center border border-gray-200">
      <span class="material-symbols-outlined text-[40px] text-[#466CF4]">inventory_2</span>
    </div>
    <h1 class="font-['Montserrat'] text-[26px] font-bold text-gray-900 tracking-tight">Controle de Insumos</h1>
    <p class="text-sm text-gray-500 mt-1">Acesse para gerenciar solicitações e estoque</p>
  </div>
  
  <div class="w-full bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
    <form class="space-y-4" onsubmit="event.preventDefault(); handleLoginSubmit();">
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-gray-700">E-mail Corporativo</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-gray-400 text-[18px]">alternate_email</span>
          <input id="corporateEmail" class="w-full pl-10 pr-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm focus:border-[#466CF4] outline-none" type="email" placeholder="seu.email@empresa.com" required>
        </div>
      </div>
      <div class="space-y-1.5">
        <label class="block text-xs font-semibold text-gray-700">Senha</label>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3.5 text-gray-400 text-[18px]">lock</span>
          <input id="corporatePassword" class="w-full pl-10 pr-10 py-2.5 rounded-lg border border-gray-200 bg-gray-50 text-sm focus:border-[#466CF4] outline-none" type="password" placeholder="••••••••" required>
        </div>
      </div>
      <button id="btnSubmit" class="w-full mt-4 py-2.5 rounded-lg bg-[#466CF4] text-white text-sm font-semibold flex items-center justify-center gap-2 hover:bg-blue-700 transition-colors" type="submit">
        <span class="material-symbols-outlined text-[18px]" id="btnIcon">login</span> <span id="btnText">Entrar</span>
      </button>
    </form>
    
    <div class="mt-6 pt-5 border-t border-gray-200 flex justify-center gap-2 text-xs">
      <span class="text-gray-500">Teste:</span>
      <button class="text-[#466CF4] font-medium" onclick="document.getElementById('corporateEmail').value='admin.ti@insumos.org';document.getElementById('corporatePassword').value='Gestor#TI2024!';">Admin</button> | 
      <button class="text-[#466CF4] font-medium" onclick="document.getElementById('corporateEmail').value='colaborador@insumos.org';document.getElementById('corporatePassword').value='Requisicao#2024';">Solicitante</button>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from './js/supabase.js';
  
  // Se já tiver sessão logada, manda para o painel
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'materiais.html';
  });

  window.handleLoginSubmit = async function() {
    const email = document.getElementById('corporateEmail').value;
    const password = document.getElementById('corporatePassword').value;
    const btn = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    
    if (!email || !password) return;
    
    btn.disabled = true;
    btn.classList.add('opacity-75');
    btnText.textContent = 'Verificando...';
    btnIcon.textContent = 'progress_activity';
    btnIcon.classList.add('animate-spin');

    const { error } = await supabase.auth.signInWithPassword({ email, password });
    
    btnIcon.classList.remove('animate-spin');
    if (error) {
      alert('Acesso negado: E-mail ou senha incorretos.');
      btn.disabled = false;
      btn.classList.remove('opacity-75');
      btnText.textContent = 'Entrar';
      btnIcon.textContent = 'login';
    } else {
      btnText.textContent = 'Acesso Autorizado!';
      btnIcon.textContent = 'check_circle';
      setTimeout(() => { window.location.href = 'materiais.html'; }, 1000);
    }
  }
</script>
</body>
</html>
